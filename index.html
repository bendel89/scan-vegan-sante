<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scan Vegan">
<meta name="theme-color" content="#0a0e1a">
<title>Scan Vegan & Santé</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0e1a;color:#e8ecf8;min-height:100vh;padding:calc(env(safe-area-inset-top) + 1rem) 1rem calc(env(safe-area-inset-bottom) + 3rem);font-size:16px;line-height:1.5;max-width:900px;margin:0 auto;-webkit-text-size-adjust:100%}
h1{text-align:center;font-size:1.5rem;margin-bottom:0.3rem;background:linear-gradient(135deg,#4a9eff,#7c5cff,#d94aff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;font-size:0.8rem;color:#8892b0;margin-bottom:1.2rem}
.tabs{display:flex;gap:0.4rem;margin-bottom:1rem;overflow-x:auto;padding-bottom:0.3rem}
.tab{flex:1;min-width:80px;padding:0.6rem 0.4rem;border-radius:10px;background:#131829;border:1px solid #2a3350;color:#8892b0;font-size:0.75rem;font-weight:600;cursor:pointer;text-align:center;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,#4a9eff,#7c5cff);color:#fff;border-color:transparent}
.panel{background:#131829;border:1px solid #2a3350;border-radius:16px;padding:1rem;margin-bottom:1rem}
.lbl{font-size:0.72rem;color:#8892b0;text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:0.6rem}
input[type=text]{width:100%;padding:1rem;border-radius:12px;border:1px solid #2a3350;background:#1a2036;color:#e8ecf8;font-family:inherit;font-size:17px;-webkit-appearance:none}
input:focus{outline:none;border-color:#4a9eff}
button.primary{width:100%;padding:1rem;border-radius:14px;border:none;background:linear-gradient(135deg,#4a9eff,#7c5cff);color:#fff;font-size:1.05rem;font-weight:600;font-family:inherit;cursor:pointer;margin-top:0.6rem}
button.primary:active{transform:scale(0.98)}
button.camera{background:linear-gradient(135deg,#2d8a4e,#6ee7a3);color:#0a0e1a}
button.stop{background:linear-gradient(135deg,#c0392b,#e07070);color:#fff}
button.small{padding:0.6rem;font-size:0.85rem;margin-top:0.4rem}
.badge{display:inline-block;padding:0.4rem 0.9rem;border-radius:20px;font-size:0.8rem;font-weight:700;margin:0.2rem 0.2rem 0.2rem 0}
.badge.vegan{background:#2d8a4e;color:#fff}
.badge.nonvegan{background:#c0392b;color:#fff}
.badge.insect{background:#d4a017;color:#000}
.badge.health{background:#4a9eff;color:#fff}
.badge.allergen{background:#d97706;color:#fff}
.card{background:#131829;border:1px solid #2a3350;border-radius:16px;padding:1rem;margin-bottom:1rem}
.card.good{border-color:#2d8a4e}
.card.bad{border-color:#c0392b}
.card.warn{border-color:#d4a017}
.card h3{font-size:1rem;margin-bottom:0.5rem}
.row{display:flex;justify-content:space-between;align-items:flex-start;padding:0.6rem 0;border-bottom:1px solid #1f2740;gap:0.8rem}
.row:last-child{border-bottom:none}
.row-label{font-size:0.8rem;color:#8892b0;flex-shrink:0;font-weight:600}
.row-value{font-size:0.85rem;font-weight:600;text-align:right;flex:1;min-width:0}
.row-value.good{color:#6ee7a3}
.row-value.bad{color:#e07070}
.row-value.warn{color:#d4a017}
.loading{text-align:center;color:#8892b0;padding:2rem;font-size:0.9rem}
.spinner{width:18px;height:18px;border:2px solid rgba(74,158,255,0.3);border-top-color:#4a9eff;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;vertical-align:middle;margin-right:0.5rem}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#e07070;text-align:center;padding:1rem;font-size:0.9rem}
.note{font-size:0.7rem;color:#4a5578;text-align:center;margin-top:0.8rem}
.hidden{display:none!important}
#reader{border-radius:12px;overflow:hidden;background:#000}
#reader video{border-radius:12px}
.product-img{width:100%;max-height:200px;object-fit:contain;border-radius:12px;background:#1a2036;margin-bottom:0.6rem}
.score-circle{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;margin:0.5rem auto;color:#fff}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:0.7rem;background:#1a2036;border-radius:10px;margin-bottom:0.5rem;cursor:pointer;font-size:0.85rem}
.hist-item:active{background:#232b47}
.hist-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-score{font-weight:700;padding:0.2rem 0.6rem;border-radius:8px;font-size:0.75rem;margin-left:0.5rem;color:#fff}
.btn-share{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff;padding:0.8rem;border-radius:12px;border:none;width:100%;font-weight:600;font-size:0.9rem;margin-top:0.6rem;cursor:pointer;font-family:inherit}
.btn-share:active{transform:scale(0.98)}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem}
.cmp-cell{background:#1a2036;border-radius:10px;padding:0.7rem;font-size:0.8rem;text-align:center}
.cmp-label{grid-column:1/-1;text-align:center;font-weight:700;color:#8892b0;font-size:0.75rem;text-transform:uppercase;margin-top:0.6rem}
</style>
</head>
<body>

<h1>🔍 Scan Vegan & Santé</h1>
<p class="sub">Analyse complète de ton produit</p>

<div class="tabs">
  <div class="tab active" data-tab="scan">📷 Scanner</div>
  <div class="tab" data-tab="compare">⚖️ Comparer</div>
  <div class="tab" data-tab="history">📜 Historique</div>
</div>

<div id="tab-scan">
  <div class="panel">
    <div class="lbl">📷 Code-barres du produit</div>
    <input type="text" id="barcode" placeholder="Ex : 3017620422003" inputmode="numeric" autocomplete="off" enterkeyhint="search">
    <button class="primary" id="btnScan">🔍 Analyser</button>
    <button class="primary camera" id="btnCamera">📷 Scanner avec la caméra</button>
    <div id="cameraZone" class="hidden" style="margin-top:1rem">
      <div id="reader"></div>
      <button class="primary stop" id="btnStopCamera">❌ Arrêter la caméra</button>
    </div>
  </div>
  <div id="result"></div>
</div>

<div id="tab-compare" class="hidden">
  <div class="panel">
    <div class="lbl">⚖️ Comparer 2 produits</div>
    <input type="text" id="cmp1" placeholder="1er code-barres" inputmode="numeric" autocomplete="off">
    <input type="text" id="cmp2" placeholder="2ème code-barres" inputmode="numeric" autocomplete="off" style="margin-top:0.5rem">
    <button class="primary" id="btnCompare">⚖️ Comparer</button>
  </div>
  <div id="compareResult"></div>
</div>

<div id="tab-history" class="hidden">
  <div class="panel">
    <div class="lbl">📜 Derniers scans</div>
    <button class="primary small" id="btnClearHist" style="background:#c0392b">🗑️ Effacer l'historique</button>
  </div>
  <div id="historyList"></div>
</div>

<div class="note">Données Open Food Facts · Analyse locale</div>
<script>
// ========================================================
// 🐜 INSECTES AUTORISÉS EN SUISSE + UE
// ========================================================
const INSECT_KEYWORDS = [
  'tenebrio molitor','ver de farine','mehlwurm','mealworm','vers de farine',
  'acheta domesticus','grillon','grillons','cricket','heimchen',
  'locusta migratoria','criquet','criquets','locust','wanderheuschrecke',
  'alphitobius diaperinus','petit ténébrion','buffalo worm','ténébrion',
  'insecte','insect','insectes','farine d\'insecte','farine d insecte',
  'poudre de larve','poudre de larves','protéine d\'insecte','proteine d\'insecte',
  'protéines d\'insectes','chitine','larve','larves'
];

// ========================================================
// 🌱 INGRÉDIENTS NON VEGAN
// ========================================================
const NON_VEGAN_KEYWORDS = [
  'lait','milk','beurre','butter','crème','creme','cream','fromage','cheese',
  'yaourt','yogurt','yoghurt','lactose','caséine','casein','caseinate',
  'lactosérum','whey','petit-lait','babeurre','buttermilk','ghee',
  'mascarpone','ricotta','mozzarella','parmesan',
  'oeuf','œuf','oeufs','œufs','egg','eggs','albumen','ovalbumine','lysozyme',
  'miel','honey','cire d\'abeille','beeswax','propolis','gelée royale',
  'viande','meat','poulet','chicken','boeuf','bœuf','beef','porc','pork',
  'jambon','ham','agneau','lamb','veau','veal','canard','duck','dinde','turkey',
  'gibier','lapin','rabbit','cheval','horse','mouton','mutton',
  'saucisse','sausage','saucisson','bacon','lardon','chorizo','salami',
  'pâté','terrine','rillettes','foie','abats',
  'poisson','fish','thon','tuna','saumon','salmon','cabillaud','cod',
  'crevette','shrimp','crabe','crab','homard','lobster','langouste',
  'moule','mussel','huître','huitre','oyster','anchois','anchovy',
  'sardine','maquereau','truite','trout','sole','raie','requin','shark',
  'calamar','squid','poulpe','octopus','seiche','surimi','tarama','caviar',
  'gélatine','gelatin','graisse animale','animal fat','saindoux','lard',
  'suif','tallow','bouillon','broth','extrait de viande','extrait de poulet',
  'e120','e904','e901','e920','e921','e913','e1105','e441','e542',
  'cochenille','cochineal','carmine','carmin','shellac','lécithine','lecitin',
  'acide carminique','lanoline','cholestérol','cysteine',
  'collagène','collagen','élastine','elastin','kératine','keratin',
  'pepsine','pepsin','présure','rennet','chymosine'
];

// ========================================================
// 🇨🇭 ADDITIFS CONTROVERSÉS
// ========================================================
const HEALTH_WARNINGS = {
  'e249':{level:'danger',msg:'Nitrite de potassium — composés cancérigènes'},
  'e250':{level:'danger',msg:'Nitrite de sodium — composés cancérigènes'},
  'e251':{level:'danger',msg:'Nitrate de sodium — précurseur de nitrites'},
  'e252':{level:'danger',msg:'Nitrate de potassium — précurseur de nitrites'},
  'e202':{level:'warn',msg:'Sorbate de potassium — risque d\'hypertension'},
  'e200':{level:'warn',msg:'Acide sorbique — conservateur'},
  'e150a':{level:'warn',msg:'Colorant caramel — associé au diabète type 2'},
  'e150b':{level:'warn',msg:'Caramel sulfite — controversé'},
  'e150c':{level:'warn',msg:'Caramel ammoniacal — controversé'},
  'e150d':{level:'warn',msg:'Caramel sulfite-ammoniacal — controversé'},
  'e120':{level:'danger',msg:'Rouge cochenille — extrait d\'insectes'},
  'e904':{level:'danger',msg:'Shellac — résine d\'insecte'},
  'e901':{level:'warn',msg:'Cire d\'abeille — non végétalien'},
  'e621':{level:'warn',msg:'Glutamate monosodique — sensibilité possible'},
  'e951':{level:'warn',msg:'Aspartame — sujet à débat'},
  'e952':{level:'warn',msg:'Cyclamate — controversé'},
  'e954':{level:'warn',msg:'Saccharine — controverse historique'},
  'e955':{level:'warn',msg:'Sucralose — controverse'},
  'e220':{level:'warn',msg:'Anhydride sulfureux — allergène'},
  'e221':{level:'warn',msg:'Sulfite de sodium — allergène'},
  'e222':{level:'warn',msg:'Sulfite acide de sodium — allergène'},
  'e223':{level:'warn',msg:'Disulfite de sodium — allergène'},
  'e224':{level:'warn',msg:'Disulfite de potassium — allergène'},
  'e226':{level:'warn',msg:'Sulfite de calcium — allergène'},
  'e227':{level:'warn',msg:'Sulfite acide de calcium — allergène'},
  'e228':{level:'warn',msg:'Sulfite acide de potassium — allergène'},
  'e102':{level:'warn',msg:'Tartrazine — colorant azoïque controversé'},
  'e104':{level:'warn',msg:'Jaune de quinoléine — colorant controversé'},
  'e110':{level:'warn',msg:'Jaune orangé S — colorant azoïque'},
  'e122':{level:'warn',msg:'Azorubine — colorant azoïque'},
  'e124':{level:'warn',msg:'Ponceau 4R — colorant azoïque'},
  'e129':{level:'warn',msg:'Rouge allura — colorant azoïque'},
  'e171':{level:'danger',msg:'Dioxyde de titane — interdit dans l\'UE depuis 2022'},
  'e320':{level:'warn',msg:'BHA — antioxydant controversé'},
  'e321':{level:'warn',msg:'BHT — antioxydant controversé'},
  'e407':{level:'warn',msg:'Carraghénanes — inflammation possible'},
  'e415':{level:'warn',msg:'Xanthane — peut causer ballonnements'},
  'e950':{level:'warn',msg:'Acésulfame K — controverse'},
  'e961':{level:'warn',msg:'Néotame — controverse'}
};

// ========================================================
// 🚨 ALLERGÈNES (14 majeurs UE)
// ========================================================
const ALLERGEN_MAP = {
  'gluten':'🌾 Gluten','cereals-containing-gluten':'🌾 Gluten',
  'crustaceans':'🦐 Crustacés','eggs':'🥚 Œufs','fish':'🐟 Poisson',
  'peanuts':'🥜 Arachides','soybeans':'🫘 Soja','milk':'🥛 Lait',
  'nuts':'🌰 Fruits à coque','celery':'🥬 Céleri','mustard':'🌭 Moutarde',
  'sesame-seeds':'⚪ Sésame','sulphur-dioxide-and-sulphites':'💨 Sulfites',
  'lupin':'🌸 Lupin','molluscs':'🦑 Mollusques'
};

// ========================================================
// 🔍 DÉTECTIONS
// ========================================================
function detectInsects(texte){
  if(!texte) return [];
  const t=texte.toLowerCase();
  return [...new Set(INSECT_KEYWORDS.filter(k=>t.includes(k)))];
}
function detectNonVegan(texte){
  if(!texte) return [];
  const t=texte.toLowerCase();
  return [...new Set(NON_VEGAN_KEYWORDS.filter(k=>t.includes(k)))];
}
function detectHealthWarnings(additifs){
  if(!additifs) return [];
  const t=additifs.toLowerCase();
  const trouves=[];
  for(const [code,info] of Object.entries(HEALTH_WARNINGS)){
    if(t.includes(code)||t.includes('en:'+code)) trouves.push({code:code.toUpperCase(),...info});
  }
  return trouves;
}
function detectAllergens(tags){
  if(!tags||!tags.length) return [];
  return [...new Set(tags.map(a=>{
    const k=a.replace('en:','');
    return ALLERGEN_MAP[k]||('⚠️ '+k);
  }))];
}

// ========================================================
// 📊 SCORE GLOBAL /100
// ========================================================
function calculerScore(nonVegan,insectes,alertes,nutriscore,allergenes){
  let score=100;
  score-=Math.min(nonVegan.length*8,40);
  if(insectes.length>0) score-=30;
  alertes.forEach(a=>{score-=(a.level==='danger'?10:5)});
  if(nutriscore){
    const pts={A:0,B:5,C:10,D:15,E:20};
    score-=(pts[nutriscore]||0);
  }
  if(allergenes.length>0) score-=Math.min(allergenes.length*2,10);
  return Math.max(0,Math.min(100,score));
}
function scoreColor(s){
  if(s>=80) return '#2d8a4e';
  if(s>=60) return '#6ee7a3';
  if(s>=40) return '#d4a017';
  if(s>=20) return '#e07070';
  return '#c0392b';
}
function scoreLabel(s){
  if(s>=80) return 'EXCELLENT';
  if(s>=60) return 'BON';
  if(s>=40) return 'MOYEN';
  if(s>=20) return 'MAUVAIS';
  return 'À ÉVITER';
}

// ========================================================
// 💾 CACHE + HISTORIQUE
// ========================================================
const CACHE_KEY='svs_cache_v2';
const HIST_KEY='svs_hist_v2';
function getCache(){try{return JSON.parse(localStorage.getItem(CACHE_KEY)||'{}')}catch(e){return{}}}
function setCache(c){try{localStorage.setItem(CACHE_KEY,JSON.stringify(c))}catch(e){}}
function getHist(){try{return JSON.parse(localStorage.getItem(HIST_KEY)||'[]')}catch(e){return[]}}
function setHist(h){try{localStorage.setItem(HIST_KEY,JSON.stringify(h.slice(0,20)))}catch(e){}}
function ajouterHist(item){
  const h=getHist().filter(x=>x.code!==item.code);
  h.unshift(item);
  setHist(h);
}

// ========================================================
// 🌐 CHARGEMENT PRODUIT
// ========================================================
async function chargerProduit(code){
  const cache=getCache();
  if(cache[code]) return cache[code];
  const url=`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_fr,ingredients_text,ingredients_text_fr,additives_tags,allergens_tags,nutriscore_grade,brands,categories,image_front_small_url,image_url,quantity,countries`;
  const r=await fetch(url);
  const d=await r.json();
  if(d.product){
    cache[code]=d.product;
    setCache(cache);
  }
  return d.product;
}

// ========================================================
// 🎯 RENDU PRODUIT
// ========================================================
function renderProduit(p,code,targetId){
  const zone=document.getElementById(targetId);
  if(!p){
    zone.innerHTML='<div class="error">❌ Produit introuvable.<br><br>Essaie un autre code-barres.</div>';
    return;
  }
  const ingredients=p.ingredients_text_fr||p.ingredients_text||'';
  const additifsListe=p.additives_tags||[];
  const additifsTexte=additifsListe.join(' ');
  const nom=p.product_name_fr||p.product_name||'Produit sans nom';
  const marque=p.brands||'';
  const nutriscore=p.nutriscore_grade?p.nutriscore_grade.toUpperCase():null;
  const image=p.image_front_small_url||p.image_url||null;
  const allergenesTags=p.allergens_tags||[];

  const insectes=detectInsects(ingredients);
  const nonVegan=detectNonVegan(ingredients);
  const nonVeganAdd=additifsListe.filter(a=>a.includes('e120')||a.includes('e904')||a.includes('e901')||a.includes('e920')||a.includes('e921')||a.includes('e1105'));
  const tousNonVegan=[...new Set([...nonVegan,...nonVeganAdd])];
  const alertes=detectHealthWarnings(additifsTexte);
  const allergenes=detectAllergens(allergenesTags);
  const score=calculerScore(tousNonVegan,insectes,alertes,nutriscore,allergenes);

  let html='';

  if(image){
    html+=`<div class="card"><img src="${image}" class="product-img" alt="produit" onerror="this.style.display='none'"></div>`;
  }

  html+=`<div class="card">
    <h3>${marque?marque+' — ':''}${nom}</h3>
    <div style="font-size:0.75rem;color:#8892b0;margin-top:0.3rem">Code-barres : ${code}</div>
    <div class="score-circle" style="background:${scoreColor(score)}">${score}</div>
    <div style="text-align:center;font-weight:700;color:${scoreColor(score)};font-size:0.9rem">${scoreLabel(score)} / 100</div>
  </div>`;

  const estVegan=tousNonVegan.length===0;
  html+=`<div class="card ${estVegan?'good':'bad'}">
    <div class="lbl">🌱 Analyse Vegan</div>
    <span class="badge ${estVegan?'vegan':'nonvegan'}">${estVegan?'✅ VEGAN':'❌ NON VEGAN'}</span>
    ${!estVegan?`<div style="margin-top:0.7rem;font-size:0.82rem;color:#e07070"><strong>Détecté :</strong> ${tousNonVegan.slice(0,8).join(', ')}${tousNonVegan.length>8?'…':''}</div>`:''}
  </div>`;

  html+=`<div class="card ${insectes.length>0?'warn':'good'}">
    <div class="lbl">🐜 Alerte Insectes</div>
    <span class="badge ${insectes.length>0?'insect':'vegan'}">${insectes.length>0?'⚠️ INSECTES DÉTECTÉS':'✅ Aucun insecte'}</span>
    ${insectes.length>0?`<div style="margin-top:0.7rem;font-size:0.82rem;color:#d4a017"><strong>Détecté :</strong> ${insectes.join(', ')}</div>`:''}
    <div style="margin-top:0.6rem;font-size:0.7rem;color:#8892b0">Recherche : Tenebrio molitor · Acheta domesticus · Locusta migratoria · Alphitobius diaperinus</div>
  </div>`;

  if(allergenes.length>0){
    html+=`<div class="card warn">
      <div class="lbl">🚨 Allergènes (${allergenes.length})</div>
      ${allergenes.map(a=>`<span class="badge allergen">${a}</span>`).join('')}
    </div>`;
  }else{
    html+=`<div class="card good">
      <div class="lbl">🚨 Allergènes</div>
      <span class="badge health">✅ Aucun allergène majeur signalé</span>
    </div>`;
  }

  const aDanger=alertes.some(a=>a.level==='danger');
  const aWarn=alertes.some(a=>a.level==='warn');
  html+=`<div class="card ${aDanger?'bad':aWarn?'warn':'good'}">
    <div class="lbl">🇨🇭 Santé / Additifs</div>`;
  if(alertes.length===0){
    html+=`<span class="badge health">✅ Aucun additif signalé</span>`;
  }else{
    alertes.forEach(a=>{
      html+=`<div class="row"><span class="row-label">${a.code}</span><span class="row-value ${a.level==='danger'?'bad':'warn'}">${a.msg}</span></div>`;
    });
  }
  html+=`</div>`;

  if(additifsListe.length>0){
    const codes=additifsListe.map(a=>a.replace('en:','').toUpperCase());
    html+=`<div class="card"><div class="lbl">🧪 Tous les additifs (${codes.length})</div><div style="font-size:0.8rem;color:#8892b0;line-height:1.8">${codes.join(' · ')}</div></div>`;
  }

  if(nutriscore){
    const c={A:'#2d8a4e',B:'#6ee7a3',C:'#d4a017',D:'#e07070',E:'#c0392b'};
    html+=`<div class="card"><div class="lbl">📊 Nutri-Score</div><span class="badge" style="background:${c[nutriscore]||'#4a9eff'};color:#fff;font-size:1.2rem;padding:0.6rem 1.4rem">${nutriscore}</span></div>`;
  }

  html+=`<button class="btn-share" data-share='${JSON.stringify({nom,score,vegan:estVegan,insectes:insectes.length}).replace(/'/g,"&#39;")}'>📤 Partager le résultat</button>`;

  zone.innerHTML=html;

  // Bouton partage
  const btn=zone.querySelector('.btn-share');
  if(btn){
    btn.addEventListener('click',async()=>{
      const d=JSON.parse(btn.dataset.share);
      const txt=`🔍 Scan Vegan & Santé\n\n📦 ${d.nom}\n⭐ Score : ${d.score}/100\n🌱 Vegan : ${d.vegan?'✅ Oui':'❌ Non'}\n🐜 Insectes : ${d.insectes>0?'⚠️ OUI':'✅ Aucun'}`;
      if(navigator.share){
        try{await navigator.share({title:'Scan Vegan & Santé',text:txt})}catch(e){}
      }else{
        try{await navigator.clipboard.writeText(txt);alert('📋 Copié dans le presse-papiers !')}catch(e){alert(txt)}
      }
    });
  }

  ajouterHist({code,nom,score,date:Date.now(),image});
}

// ========================================================
// 🎯 ANALYSE
// ========================================================
async function analyserCodeBarres(code){
  const zone=document.getElementById('result');
  zone.innerHTML='<div class="loading"><span class="spinner"></span>Recherche en cours…</div>';
  try{
    const p=await chargerProduit(code);
    renderProduit(p,code,'result');
  }catch(e){
    zone.innerHTML=`<div class="error">❌ Erreur réseau : ${e.message}<br><br>Vérifie ta connexion internet.</div>`;
  }
}

// ========================================================
// ⚖️ COMPARAISON
// ========================================================
async function comparer(){
  const z=document.getElementById('compareResult');
  const c1=document.getElementById('cmp1').value.trim();
  const c2=document.getElementById('cmp2').value.trim();
  if(!c1||!c2){alert('Entre 2 codes-barres');return}
  z.innerHTML='<div class="loading"><span class="spinner"></span>Chargement…</div>';
  try{
    const [p1,p2]=await Promise.all([chargerProduit(c1),chargerProduit(c2)]);
    if(!p1||!p2){z.innerHTML='<div class="error">❌ Un des produits est introuvable.</div>';return}
    const info=(p)=>{
      const ing=p.ingredients_text_fr||p.ingredients_text||'';
      const add=p.additives_tags||[];
      const nv=[...new Set([...detectNonVegan(ing),...add.filter(a=>a.includes('e120')||a.includes('e904')||a.includes('e901'))])];
      const ins=detectInsects(ing);
      const al=detectHealthWarnings(add.join(' '));
      const alg=detectAllergens(p.allergens_tags||[]);
      const ns=p.nutriscore_grade?p.nutriscore_grade.toUpperCase():null;
      const sc=calculerScore(nv,ins,al,ns,alg);
      return {nom:p.product_name_fr||p.product_name||'?',score:sc,vegan:nv.length===0,insectes:ins.length,alertes:al.length,nutriscore:ns,allergenes:alg.length};
    };
    const i1=info(p1),i2=info(p2);
    const w=(a,b)=>a>b?'bad':(a<b?'good':'');
    z.innerHTML=`
      <div class="card">
        <div class="lbl">⚖️ Résultat de la comparaison</div>
        <div class="cmp-grid">
          <div class="cmp-cell"><strong>${i1.nom}</strong></div>
          <div class="cmp-cell"><strong>${i2.nom}</strong></div>
          <div class="cmp-label">Score global</div>
          <div class="cmp-cell" style="color:${scoreColor(i1.score)}">${i1.score}</div>
          <div class="cmp-cell" style="color:${scoreColor(i2.score)}">${i2.score}</div>
          <div class="cmp-label">Vegan</div>
          <div class="cmp-cell">${i1.vegan?'✅':'❌'}</div>
          <div class="cmp-cell">${i2.vegan?'✅':'❌'}</div>
          <div class="cmp-label">Insectes</div>
          <div class="cmp-cell ${w(i1.insectes,i2.insectes)}">${i1.insectes>0?'⚠️ '+i1.insectes:'✅'}</div>
          <div class="cmp-cell ${w(i2.insectes,i1.insectes)}">${i2.insectes>0?'⚠️ '+i2.insectes:'✅'}</div>
          <div class="cmp-label">Additifs signalés</div>
          <div class="cmp-cell ${w(i1.alertes,i2.alertes)}">${i1.alertes}</div>
          <div class="cmp-cell ${w(i2.alertes,i1.alertes)}">${i2.alertes}</div>
          <div class="cmp-label">Nutri-Score</div>
          <div class="cmp-cell">${i1.nutriscore||'—'}</div>
          <div class="cmp-cell">${i2.nutriscore||'—'}</div>
          <div class="cmp-label">Allergènes</div>
          <div class="cmp-cell ${w(i1.allergenes,i2.allergenes)}">${i1.allergenes}</div>
          <div class="cmp-cell ${w(i2.allergenes,i1.allergenes)}">${i2.allergenes}</div>
        </div>
        <div style="margin-top:1rem;text-align:center;font-weight:700;color:${i1.score>=i2.score?'#6ee7a3':'#e07070'}">
          🏆 Gagnant : ${i1.score>=i2.score?i1.nom:i2.nom}
        </div>
      </div>`;
  }catch(e){
    z.innerHTML=`<div class="error">❌ Erreur : ${e.message}</div>`;
  }
}

// ========================================================
// 📜 HISTORIQUE
// ========================================================
function afficherHistorique(){
  const z=document.getElementById('historyList');
  const h=getHist();
  if(h.length===0){
    z.innerHTML='<div class="panel" style="text-align:center;color:#8892b0">Aucun scan pour le moment</div>';
    return;
  }
  z.innerHTML=h.map(item=>{
    const d=new Date(item.date);
    const dateStr=d.toLocaleDateString('fr-CH',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'});
    return `<div class="hist-item" data-code="${item.code}">
      <div class="hist-name"><strong>${item.nom}</strong><br><span style="font-size:0.7rem;color:#8892b0">${dateStr}</span></div>
      <span class="hist-score" style="background:${scoreColor(item.score)}">${item.score}</span>
    </div>`;
  }).join('');
  z.querySelectorAll('.hist-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const code=el.dataset.code;
      switchTab('scan');
      document.getElementById('barcode').value=code;
      analyserCodeBarres(code);
    });
  });
}

// ========================================================
// 🎬 ONGLETS
// ========================================================
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.getElementById('tab-scan').classList.toggle('hidden',name!=='scan');
  document.getElementById('tab-compare').classList.toggle('hidden',name!=='compare');
  document.getElementById('tab-history').classList.toggle('hidden',name!=='history');
  if(name==='history') afficherHistorique();
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>switchTab(t.dataset.tab));
});

// ========================================================
// 🎬 ÉVÉNEMENTS SCAN
// ========================================================
document.getElementById('btnScan').addEventListener('click',()=>{
  const code=document.getElementById('barcode').value.trim();
  if(code) analyserCodeBarres(code);
});
document.getElementById('barcode').addEventListener('keydown',(e)=>{
  if(e.key==='Enter'){e.preventDefault();const c=document.getElementById('barcode').value.trim();if(c)analyserCodeBarres(c)}
});
document.getElementById('btnCompare').addEventListener('click',comparer);
document.getElementById('btnClearHist').addEventListener('click',()=>{
  if(confirm('Effacer tout l\'historique ?')){setHist([]);afficherHistorique()}
});

// ========================================================
// 📷 SCAN CAMÉRA
// ========================================================
let html5QrCode=null;
async function demarrerCamera(){
  const zone=document.getElementById('cameraZone');
  zone.classList.remove('hidden');
  if(!html5QrCode) html5QrCode=new Html5Qrcode("reader");
  try{
    await html5QrCode.start(
      {facingMode:"environment"},
      {
        fps:10,
        qrbox:{width:280,height:180},
        aspectRatio:1.0,
        formatsToSupport:[
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      },
      (texteDecode)=>{
        document.getElementById('barcode').value=texteDecode;
        arreterCamera();
        analyserCodeBarres(texteDecode);
      },
      ()=>{}
    );
  }catch(err){
    alert("❌ Impossible d'accéder à la caméra.\n\nVérifie que tu as autorisé la caméra dans Safari.\n\nDétail : "+err.message);
    zone.classList.add('hidden');
  }
}
async function arreterCamera(){
  if(html5QrCode){
    try{await html5QrCode.stop();html5QrCode.clear()}catch(e){}
  }
  document.getElementById('cameraZone').classList.add('hidden');
}
document.getElementById('btnCamera').addEventListener('click',demarrerCamera);
document.getElementById('btnStopCamera').addEventListener('click',arreterCamera);

// 🚀 INIT
// ========================================================
console.log('✅ Scan Vegan & Santé — chargé');
</script>
